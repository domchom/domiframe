<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · DomiFrame</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#e8e8e8" media="(prefers-color-scheme: light)">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header class="brand">
      <a class="home-link" href="/" aria-label="DomiFrame home"><h1>DomiFrame</h1><span class="mark" aria-hidden="true"></span></a>

    <section class="card">
      <p class="eyebrow">404 · Page not found</p>
      <h2 class="headline">Nothing came through</h2>
      <p class="lede">There's no page at this address. If someone sent you a link to their frame, check that it was copied whole.</p>
      <div class="cta">

        <a class="chip" href="/#frame">Open my frame</a>
      </div>
    </section>
  </main>
