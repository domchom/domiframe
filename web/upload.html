<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DomiFrame</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>DomiFrame</h1>
    </header>
    <section class="card">
      <h2 id="frame-name">Your frame</h2>
      <p class="muted" id="frame-status">Loading…</p>
      <figure class="current">
        <img id="current-img" alt="" hidden>
        <figcaption class="muted" id="current-caption">Nothing on the frame yet.</figcaption>
      </figure>
    </section>

    <section class="card">
      <h2>New picture</h2>
      <label class="picker">
        <input type="file" id="file" accept="image/*">
        <span>Choose a photo</span>
      </label>

      <div id="editor" hidden>
        <div class="row">
          <div class="seg" role="radiogroup" aria-label="Orientation">
            <label><input type="radio" name="orient" value="landscape" checked><span>Landscape</span></label>
            <label><input type="radio" name="orient" value="portrait"><span>Portrait</span></label>
          </div>
          <div class="seg" role="radiogroup" aria-label="Fit">
            <label><input type="radio" name="fit" value="cover" checked><span>Fill</span></label>
            <label><input type="radio" name="fit" value="contain"><span>Fit</span></label>
          </div>
        </div>

        <label class="slider">Color boost
          <input type="range" id="saturation" min="0.6" max="2" step="0.05" value="1.3">
        </label>
        <label class="slider">Brightness
          <input type="range" id="brightness" min="0.7" max="1.4" step="0.05" value="1.05">
        </label>

        <p class="muted small">Preview of how it will look on the frame:</p>
        <canvas id="preview" class="preview"></canvas>

        <button id="send" class="primary">Send to frame</button>
      </div>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <p class="muted small foot">The frame checks for new pictures about once an hour. Press its button to update now.</p>
  </main>
  <script type="module" src="/upload.js"></script>
</body>
</html>
