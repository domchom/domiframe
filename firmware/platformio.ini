; One build per screen. Flash the one that matches your frame:
;   pio run -e ee04 -t upload         7.3" Spectra 6 on the EE04 board (default)
;   pio run -e ee02-13in3 -t upload   13.3" Spectra 6 on the EE02 board

[platformio]
default_envs = ee04

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; XIAO ESP32-S3 Plus: octal PSRAM (holds the picture: 192 KB for 7.3", 960 KB for 13.3")
board_build.arduino.memory_type = qio_opi
; Root certificates for checking the server (see tools/make_ca_bundle.py)
board_build.embed_files = data/cert/x509_crt_bundle.bin
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  tzapu/WiFiManager@^2.0.17

[env:ee04]
lib_deps =
  ${env.lib_deps}
  zinggjm/GxEPD2@^1.6.9

[env:ee02-13in3]
; Seeed_GFX picks its setup from BOARD_SCREEN_COMBO (510 = XIAO + 13.3" colour ePaper)
build_flags =
  ${env.build_flags}
  -DDOMIFRAME_PANEL_13IN3
  -DBOARD_SCREEN_COMBO=510
  -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE02
  -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
  ${env.lib_deps}
  https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
