<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/brand.js"></script>
  <style>
    .wrap { max-width: 1000px; }
    .intro { font: 13px/1.6 var(--mono); color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
    #status { color: var(--ink); }

    /* The device: a black bezel around the panel, a label on the chin, a dithered shadow */
    .device { --sh: 10px; --bw: 0px; position: relative; margin: 0 10px 34px 0; }
    .device::after {
      content: ""; position: absolute; pointer-events: none;
      top: var(--sh); left: var(--sh); right: calc(-1 * var(--sh)); bottom: calc(-1 * var(--sh));
      clip-path: polygon(calc(100% - var(--sh)) 0, 100% 0, 100% 100%, 0 100%, 0 calc(100% - var(--sh)),
                         calc(100% - var(--sh)) calc(100% - var(--sh)));
      background: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0) 0 0 / 2px 2px;
    }
    .bezel { background: #0d0f10; padding: 22px 22px 0; border: 2px solid #000; }
    #screen { display: block; width: 100%; height: auto; background: #e8e8e8; image-rendering: pixelated; }
    .chin {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 2px 12px;
      font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6d7479;
    }
    .led { display: inline-block; width: 6px; height: 6px; margin-right: 8px; background: #2c3236; vertical-align: 1px; }
    .led.on { background: var(--ink-green); box-shadow: 0 0 0 2px rgba(18, 95, 32, .35); }
    /* A frame hung portrait: shown upright, as tall as fits */
    .device.portrait { width: fit-content; margin-left: auto; margin-right: auto; }
    .device.portrait #screen { width: auto; height: min(75vh, 800px); }

    .panels { display: grid; gap: 0 22px; }
    @media (min-width: 820px) { .panels { grid-template-columns: 1fr 1fr; } }
    .panels .card { margin-bottom: 28px; }
    .card h3 { margin: 0 0 14px; }
    .keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
    .keys button.primary { width: auto; flex: 1 1 180px; margin: 0; padding: 14px 16px; }
    .keys .chip { padding: 12px 14px; }
    .keys .chip.key { flex: 1 1 140px; }
    .keys .chip:disabled, .keys button.primary:disabled { opacity: .45; cursor: default; }
    .skip .chip { flex: 1; padding: 10px 8px; }
    #clock { font: 12px/1.4 var(--mono); color: var(--muted); margin: 0; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .fields .slider { margin: 0 0 14px; }
    .fields .wide { grid-column: 1 / -1; }
    .fields input.text { font: 13px/1.4 var(--mono); }
    .battery { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .battery input { flex: 1; margin: 0; }
    #mvText { font: 12px var(--mono); color: var(--ink); min-width: 64px; text-align: right; }

    #log {
      font: 12px/1.6 var(--mono); background: #0d0f10; color: #d6dadd; border: 2px solid #000;
      padding: 12px 14px; height: 200px; overflow: auto; white-space: pre-wrap; margin: 0;
    }
    .log-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><h1>Virtual frame</h1><span class="mark" aria-hidden="true"></span></header>
    <p class="intro">Behaves like the firmware: sends the device key, battery and ETag, redraws only on a
      new picture, and sleeps as long as the server says. <span id="status"></span></p>

    <div class="device" id="device">
      <div class="bezel">
        <canvas id="screen" width="800" height="480"></canvas>
        <div class="chin"><span><i class="led" id="led"></i>DomiFrame</span><span id="chin-model">Spectra 6</span></div>
      </div>
    </div>

    <div class="panels">
      <section class="card">
        <h3>Buttons</h3>
        <div class="keys">
          <button id="key1" class="primary">KEY1 · check now</button>
          <button id="key3" class="chip key">KEY3 · forget ETag</button>
        </div>
        <label class="slider">Wake by itself
          <select id="auto">
            <option value="0">Off: only when KEY1 is pressed</option>
            <option value="1">On the server's schedule, real time</option>
            <option value="60">On the server's schedule, 1 h per minute</option>
            <option value="3600">On the server's schedule, 1 h per second</option>
          </select>
        </label>
        <h3>Skip ahead, then wake</h3>
        <div class="keys skip">
          <button class="chip" data-skip="60">+1 hour</button>
          <button class="chip" data-skip="1440">+1 day</button>
          <button class="chip" data-skip="10080">+1 week</button>
          <button class="chip" id="clock-reset">Reset</button>
        </div>
        <p id="clock"></p>
      </section>

      <section class="card">
        <h3>Device</h3>
        <div class="fields">
          <label class="slider">Frame ID <input id="id" class="text" autocomplete="off"></label>
          <label class="slider">Device key <input id="key" class="text" autocomplete="off"></label>
          <label class="slider">Screen
            <select id="screen-size"><option value="7.3">7.3" (EE04)</option><option value="13.3">13.3" (EE02)</option></select>
          </label>
          <label class="slider">Hangs
            <select id="hang"><option value="landscape">Landscape (wide)</option><option value="portrait">Portrait (tall)</option></select>
          </label>
          <label class="slider">Refresh speed
            <select id="speed"><option value="1">Instant</option><option value="4" selected>Quick (~4 s)</option><option value="20">Real (~20 s)</option></select>
          </label>
          <label class="slider">Battery
            <span class="battery"><input id="mv" type="range" min="3300" max="4200" step="10" value="3900"><span id="mvText"></span></span>
          </label>
        </div>
      </section>
    </div>

    <div class="log-head"><h3>Serial log</h3></div>
    <div id="log"></div>
  </main>

  <script type="module">
    import { PALETTE, PANELS } from "/dither.js";

    const $ = (id) => document.getElementById(id);
    // Everything is drawn on a "panel" canvas in the panel's own pixel layout, exactly as the
    // hardware does (7.3": 800×480, 13.3": 1200×1600). The screen shows it upright for how the
    // frame hangs (the server says so in X-Orientation).
    const panel = document.createElement("canvas");
    const ctx = panel.getContext("2d");
    let W = 800, H = 480, screenSize = "7.3";
    function setScreen(id) {
      const p = PANELS[id] || PANELS["7.3"];
      screenSize = PANELS[id] ? id : "7.3";
      [W, H] = p.native === "landscape" ? [p.w, p.h] : [p.h, p.w];
      panel.width = W;
      panel.height = H;
      ctx.fillStyle = "rgb(232,232,232)";
      ctx.fillRect(0, 0, W, H);
    }
    let hang = "landscape";
    let hangPending = null; // chosen here, not yet confirmed by the server
    // Hung the other way from how the panel's rows run: pictures arrive turned 90° clockwise
    const turned = () => (hang === "portrait") !== (H > W);
    function show() {
      const screen = $("screen");
      const [w, h] = turned() ? [H, W] : [W, H];
      if (screen.width !== w || screen.height !== h) { screen.width = w; screen.height = h; }
      screen.style.aspectRatio = `${w} / ${h}`;
      $("device").classList.toggle("portrait", h > w);
      $("chin-model").textContent = `${PANELS[$("screen-size").value]?.name || ""} Spectra 6`;
      const sctx = screen.getContext("2d");
      // Turn the panel back, so the picture is upright
      if (turned()) sctx.setTransform(0, -1, 1, 0, 0, W);
      else sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.drawImage(panel, 0, 0);
    }
    const FW = "sim-0.3";
    const store = {
      get: (k) => { try { return localStorage.getItem("sim:" + k) || ""; } catch { return ""; } },
      set: (k, v) => { try { localStorage.setItem("sim:" + k, v); } catch {} },
    };

    // Settings come from the URL fragment printed by `npm run local`, else from last time.
    const hash = new URLSearchParams(location.hash.slice(1));
    $("id").value = hash.get("id") || store.get("id");
    $("key").value = hash.get("key") || store.get("key");
    // Not persisted: unlike real e-paper, this canvas is blank after a reload, so redownload.
    let etag = "";
    for (const f of ["id", "key"]) $(f).addEventListener("change", () => { store.set(f, $(f).value.trim()); etag = ""; });
    store.set("id", $("id").value); store.set("key", $("key").value);

    const showMv = () => ($("mvText").textContent = `${$("mv").value} mV`);
    $("mv").addEventListener("input", showMv); showMv();

    function log(msg) {
      const el = $("log");
      el.textContent += `${new Date().toLocaleTimeString()}  ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    const rgb = (i) => `rgb(${PALETTE[i].rgb.join(",")})`;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // E-paper full refresh: a few flashes of the inks, then the image.
    async function refresh(paint) {
      const total = Number($("speed").value) * 1000;
      if (total > 1000) {
        for (const i of [0, 1, 3, 2, 4, 5, 1]) {
          ctx.fillStyle = rgb(i); ctx.fillRect(0, 0, W, H);
          show();
          await sleep(total / 8);
        }
      }
      paint();
      show();
    }

    // Same layout as showMessage() in firmware/src/main.cpp (doubled on the 13.3"), drawn upright
    // however the frame hangs (rotation 1 when turned: the text's top is the panel's right edge)
    const message = (title, line1, line2) => refresh(() => {
      const m = document.createElement("canvas");
      m.width = turned() ? H : W;
      m.height = turned() ? W : H;
      const k = screenSize === "13.3" ? 2 : 1;
      const c = m.getContext("2d");
      c.fillStyle = rgb(1); c.fillRect(0, 0, m.width, m.height);
      c.fillStyle = rgb(0);
      c.font = `bold ${34 * k}px Helvetica, Arial, sans-serif`; c.fillText(title, 40 * k, 120 * k);
      c.font = `${24 * k}px Helvetica, Arial, sans-serif`; c.fillText(line1, 40 * k, 190 * k);
      if (line2) c.fillText(line2, 40 * k, 230 * k);
      [3, 2, 5, 4].forEach((b, i) => { c.fillStyle = rgb(b); c.fillRect((40 + i * 60) * k, 400 * k, 60 * k, 12 * k); });
      ctx.save();
      if (turned()) ctx.setTransform(0, 1, -1, 0, W, 0);
      ctx.drawImage(m, 0, 0);
      ctx.restore();
    });

    // Same decoding as drawPacked(): 4 bpp, high nibble = left pixel
    const drawPacked = (buf) => refresh(() => {
      const img = ctx.createImageData(W, H);
      const pal = PALETTE.map((p) => p.rgb);
      const d = img.data;
      for (let i = 0, o = 0; i < buf.length; i++) {
        const b = buf[i];
        let c = pal[(b >> 4) % 6];
        d[o++] = c[0]; d[o++] = c[1]; d[o++] = c[2]; d[o++] = 255;
        c = pal[(b & 0x0f) % 6];
        d[o++] = c[0]; d[o++] = c[1]; d[o++] = c[2]; d[o++] = 255;
      }
      ctx.putImageData(img, 0, 0);
    });

    let busy = false, drewSomething = false;
    let sleepMinutes = 60; // firmware default until the server says otherwise
    let serverTime = new Date();

    // The local server's clock can be moved forward (scripts/local.mjs /__dev/clock).
    async function clock(body) {
      const res = await fetch("/__dev/clock", body ? { method: "POST", body: JSON.stringify(body) } : {});
      return res.ok ? res.json() : null;
    }
    async function showClock() {
      const c = await clock();
      if (!c) { $("clock").textContent = "(fast-forward needs npm run local)"; return; }
      serverTime = new Date(c.now);
      $("clock").textContent = c.offsetMinutes
        ? `Server clock: ${serverTime.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })} (+${(c.offsetMinutes / 60).toFixed(1)} h)`
        : "Server clock: real time";
    }
    async function wake(reason) {
      if (busy) return;
      busy = true; $("key1").disabled = true; $("led").classList.add("on");
      const id = $("id").value.trim(), key = $("key").value.trim();
      log(`wake (${reason}) frame=${id} battery=${$("mv").value}mV etag=${etag || "-"}`);
      try {
        const headers = { "X-Device-Key": key, "X-Battery-Mv": $("mv").value, "X-Fw": FW };
        if (etag) headers["If-None-Match"] = etag;
        if (hangPending) headers["X-Set-Orientation"] = hangPending; // like the real frame's setup portal
        headers["X-Panel"] = screenSize; // the firmware reports the screen it was built for
        const res = await fetch(`/api/frames/${encodeURIComponent(id)}/image`, { headers, cache: "no-store" });
        const sleep = Number(res.headers.get("x-sleep-minutes")) || 0;
        if (res.ok || res.status === 304) hangPending = null; // the server has it now
        const newHang = res.headers.get("x-orientation");
        if (newHang && newHang !== hang) {
          hang = newHang;
          log(`frame hangs ${hang}`);
          show();
        }
        $("hang").value = hang;
        if (sleep) sleepMinutes = sleep;
        log(`GET /api/frames/${id}/image -> ${res.status}` + (sleep ? `, server says sleep ${sleep} min` : ""));
        if (res.status === 401 || res.status === 404) {
          await message("Frame not registered", "Hold KEY3 and press reset", "to re-enter the frame ID and key.");
        } else if (res.status === 200) {
          const buf = new Uint8Array(await res.arrayBuffer());
          if (buf.length !== (W * H) / 2) { log(`unexpected size ${buf.length}`); return; }
          log("new picture, redrawing");
          await drawPacked(buf);
          etag = res.headers.get("etag") || "";
        } else if (res.status === 204 && !etag && !drewSomething) {
          await message("Connected!", "Send a picture from your upload link.");
        } else {
          log(res.status === 304 ? "unchanged, keeping picture" : "nothing to draw");
        }
        drewSomething = true;
      } catch (err) {
        log(`network error: ${err.message} (keeping current picture)`);
      } finally {
        log(`sleeping ${sleepMinutes} min`);
        await showClock();
        $("status").textContent = `Last check-in ${serverTime.toLocaleString()}, next in ${sleepMinutes} min.`;
        busy = false; $("key1").disabled = false; $("led").classList.remove("on");
        scheduleNext();
      }
    }

    $("key1").addEventListener("click", () => wake("KEY1"));
    $("screen-size").addEventListener("change", () => {
      setScreen($("screen-size").value);
      store.set("screen", screenSize);
      etag = ""; // a new screen: fetch the picture made for it
      log(`screen is now ${screenSize}"; telling the server`);
      show();
      wake("screen");
    });
    $("hang").addEventListener("change", () => {
      hangPending = $("hang").value;
      log(`set to hang ${hangPending}; telling the server`);
      wake("orientation");
    });
    $("key3").addEventListener("click", () => { etag = ""; drewSomething = false; log("ETag cleared; next wake redownloads"); });

    // Sleep for sleepMinutes, sped up by the chosen factor (the server clock jumps to match).
    let timer;
    function scheduleNext() {
      clearTimeout(timer);
      const speed = Number($("auto").value);
      if (!speed) return;
      timer = setTimeout(async () => {
        if (speed > 1) await clock({ advanceMinutes: sleepMinutes });
        wake("timer");
      }, (sleepMinutes * 60e3) / speed);
    }
    $("auto").addEventListener("change", () => {
      const speed = Number($("auto").value);
      log(speed ? `auto wake on (${speed === 1 ? "real time" : `${speed}× speed`})` : "auto wake off");
      scheduleNext();
    });
    for (const b of document.querySelectorAll("[data-skip]")) {
      b.addEventListener("click", async () => {
        await clock({ advanceMinutes: Number(b.dataset.skip) });
        wake(`+${b.textContent.slice(1)}`);
      });
    }
    $("clock-reset").addEventListener("click", async () => { await clock({ reset: true }); showClock(); log("server clock reset to real time"); });
    showClock();

    // Blank panel until first wake, like a fresh device.
    setScreen(hash.get("screen") || store.get("screen") || "7.3");
    $("screen-size").value = screenSize;
    ctx.fillStyle = rgb(1); ctx.fillRect(0, 0, W, H);
    show();
    if ($("id").value && $("key").value) wake("boot");
    else message("Wi-Fi setup", "Enter the frame ID and device key below,", "then press KEY1.");
  </script>
</body>
</html>
