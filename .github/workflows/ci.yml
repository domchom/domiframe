name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Server + upload page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e ee04 -e ee02-13in3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-7in3-ee04
          path: firmware/.pio/build/ee04/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-13in3-ee02
          path: firmware/.pio/build/ee02-13in3/firmware.bin
