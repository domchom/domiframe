name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"  # weekly, for the TLS check: hosting can switch certificate authority

jobs:
  test:
    name: Server + upload page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e ee04 -e ee02-13in3
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-7in3-ee04
          path: firmware/.pio/build/ee04/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-13in3-ee02
          path: firmware/.pio/build/ee02-13in3/firmware.bin

  tls:
    name: Frames trust the server's certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 firmware/tools/make_ca_bundle.py --check domiframe.art
